# IoTHub 测试 broker（mosquitto 2.x）配置模板
# 部署位置：/etc/mosquitto/mosquitto.conf（覆盖发行包默认配置，避免 1883 双监听）
# 端口 21884：与同机 ThingsBoard 的 21883 错开，避免误连到生产 TB

pid_file /run/mosquitto/mosquitto.pid
persistence false

# 只暴露一个 listener，绑定全部网卡（云安全组再做源 IP 白名单）
listener 21884 0.0.0.0

# 必须为 true：设备固件只发 username（= mqtt_token），不发明文密码
# （mqtt.c:1683-1684 credentials.username = mqtt_token，无 password）
allow_anonymous true

# 连接与队列上限：设备常驻 1 条，测试工具若干条；给足余量但不无限
max_connections 64
max_queued_messages 500
max_inflight_messages 20
message_size_limit 65536

# 日志（journald 之外再留文件，便于 6h soak 后回溯）
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# 系统主题保留 interval（供 smoke 脚本读 $SYS/broker/uptime 判断健康）
sys_interval 10
